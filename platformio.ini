; Morse translator for the classic ESP32 board (ESP32-WROOM-32D, CP2102 USB chip).
; Upload and watch it with: pio run -t upload -t monitor
[env:esp32]
; Pinned so builds stay reproducible. 55.03.312 and 55.03.312-1 fail on PlatformIO 6.2.0.post1:
; https://github.com/pioarduino/platform-espressif32/issues/563
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 115200
